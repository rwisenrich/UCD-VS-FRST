name: Replay UCD VS FRST machines

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verifier dependencies
        run: python -m pip install --upgrade pip numpy pytest

      - name: Replay v2
        run: python machines/v2/verify_v2.py

      - name: Replay v3
        run: python machines/v3/verify_v3.py

      - name: Replay v4
        run: python machines/v4/verify_v4.py

      - name: Replay v5
        run: python machines/v5/verify_v5.py

      - name: Replay v6
        run: python machines/v6/verify_v6.py
